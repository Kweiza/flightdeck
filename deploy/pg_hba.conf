# flightdeck Postgres 원장의 접속 규칙(pg_hba.conf).
#
# compose.postgres.yaml 의 db 가 `-c hba_file=…` 로 이 파일만 읽는다. 데이터 볼륨 안의 pg_hba.conf(첫 초기화의 initdb 인자와 이미지
# 진입점이 쓴 것)는 읽지 않는다 - 그래서 이미 있는 볼륨도 기동마다 이 규칙으로 뜬다.
#
# ★ 위에서부터 처음 맞는 줄 하나가 정한다.
# ★ 초사용자(postgres)는 소켓으로만 붙는다. 소켓은 그 볼륨(pgrun)을 붙인 관리 컨테이너(migrate · db-roles)만 본다. TCP 는 IPv4 ·
#   IPv6 모두 거절한다(복제 접속까지) - 포트를 안 내고 비밀번호를 아무도 모르는 것만으로는 「TCP 로 못 붙는다」가 아니다. compose 망의
#   다른 컨테이너가 닿고, 다른 길로 만든 볼륨은 아는 비밀번호를 가질 수 있다.
# ★ 서버 계정 · 덤프 계정은 TCP(db:5432)로 SCRAM 비밀번호를 낸다. 복제는 쓰지 않아 복제 접속을 받는 줄이 없다.
# ★ db 컨테이너의 postgres 사용자(이미지의 uid)가 읽는다. 다른 사용자도 읽을 수 있어야 한다(0644).
# ★ 시험(TestPGHBARejectsSuperuserOverTCP)이 이 파일로 실제 Postgres 를 띄워 잰다.

# TYPE  DATABASE         USER      ADDRESS     METHOD
local   all              all                   trust
host    all,replication  postgres  0.0.0.0/0   reject
host    all,replication  postgres  ::/0        reject
host    all              all       0.0.0.0/0   scram-sha-256
host    all              all       ::/0        scram-sha-256
