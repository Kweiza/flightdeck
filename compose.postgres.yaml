# flightdeck Postgres 겹 — compose.yaml 위에 얹는 덮개 파일이다. 얹으면 원장이 SQLite 파일에서 Postgres 로 바뀐다.
#
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#   # 또는 설정 파일 한 곳(README 「Postgres 로 띄우기」의 compose.env)에 COMPOSE_FILE=compose.yaml:compose.postgres.yaml 을
#   # 두고 `COMPOSE_ENV_FILES=<그 파일> docker compose …`(fd-update 스킬이 그 파일이 있으면 이렇게 준다)
#
# 서비스 다섯: db(Postgres 17) → migrate(스키마 · 초사용자) → db-roles(접속 계정) → flightdeck(서버 · 앱 계정) · db-backup(매일 덤프).
#
# ★ **덮개 파일로 고르는 까닭.** 기본 `docker compose up`(compose.yaml 하나)은 지금 그대로 SQLite 파일 원장이어야 한다 -
#   갱신 한 번에 서버가 말없이 다른(빈) 원장을 보면 그것이 곧 데이터 유실로 보인다. 프로필(profiles)로는 이 전환을 못
#   한다: 프로필은 서비스를 켜고 끌 뿐 이미 있는 서비스(migrate · flightdeck)의 원장 · 의존 · 시크릿을 바꾸지 못하고, 서버에
#   시크릿을 붙이면 그 파일이 없는 기본 `up` 까지 선다. 그래서 갈아 끼우는 것 전부(원장 URL · 의존 · 시크릿 · 볼륨)를 이
#   파일 하나에 둔다. 이 파일을 안 얹은 compose 는 이 파일의 어느 줄도 읽지 않는다.
#
# ★ **원장 하나에 이 파일 하나.** 두 쪽 migrate 가 갈린 원장을 막는다. 이관(`fd migrate import-sqlite`)은 커밋한 뒤 SQLite 원장
#   옆에 이관 표지(`fd.db.moved-to-postgres`)를 남기고, 옮긴 뒤 이 파일을 빼고 `up` 하면 SQLite 쪽 migrate 가 그 표지를 보고
#   원장을 열지도 새로 만들지도 않는다. 거꾸로 이 파일을 얹은 migrate 는 /data 에 표지 없는 fd.db 가 남아 있으면 거절한다
#   (이관을 거치지 않은 새 원장 - 기준선만 까는 `--to 18` 은 받는다). 표지는 72시간 되돌리기만 지운다(README 「72시간 안에
#   되돌리기」).
#
# ★ **시크릿은 접속 계정 둘의 pgpass 파일뿐이다.** 초사용자(postgres)는 비밀번호가 없다: 아무도 모르는 난수로 만들어(아래 db
#   의 POSTGRES_PASSWORD_FILE) 네트워크로는 못 붙고, 소켓 볼륨(pgrun)을 붙인 관리 컨테이너(migrate · db-roles)만 소켓의 trust
#   로 붙는다. 서버와 매일 덤프는 그 볼륨이 없다.

services:
  # ★ 원장 DB. 포트를 내지 않는다 - compose 망 안의 서비스만 `db:5432` 로 닿는다.
  #
  # ★ container_name 을 고정한다. 데이터 볼륨(pgdata)이 프로젝트 밖의 고정 이름이라, 옛 판 자리를 안 내리고 새 판 자리에서
  #   `up` 하면 같은 데이터 디렉토리에 postmaster 가 둘 뜬다 - 컨테이너마다 PID 이름공간이 달라 postmaster.pid 가 그것을 못
  #   막고 원장이 깨진다. 이름이 같으면 둘째가 이름 충돌로 선다.
  db:
    image: postgres:17
    container_name: flightdeck-db
    restart: unless-stopped
    # 끝내기 검사점(checkpoint)을 기다린다. 기본 10초를 넘기면 SIGKILL 이고, 다음 기동이 WAL 되감기(복구)부터 한다.
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: "${FD_PG_DATABASE:-flightdeck}"
      # ★ 초사용자의 비밀번호는 커널이 읽을 때마다 새로 내는 난수다. 이미지의 진입점이 첫 초기화 때 한 번 읽고 버린다 -
      #   어디에도 안 적히고 아무도 모른다. 관리 작업은 소켓으로 한다(머리말).
      POSTGRES_PASSWORD_FILE: /proc/sys/kernel/random/uuid
      # ★ 로케일을 박는다(재설계 스펙의 DB 만들기 절, compose.test.yaml 의 pg-test 와 같은 인자에 인증 둘을 더한다).
      #   - builtin C.UTF-8: 정렬이 코드포인트 순이라 SQLite 의 BINARY 와 같은 ORDER BY 를 낸다.
      #   - --lc-ctype=C.UTF-8: pg_trgm 은 datctype(libc)으로 글자를 가른다. `C` 면 한글 trigram 이 0개라 판단 검색이 말없이
      #     0건이 된다. 이미지의 LANG(en_US.utf8)에 기대지 않는다. 서버가 기동 때 datlocale · datcollate · datctype ·
      #     show_trgm 을 잰다(`/healthz` 의 db_locale_ok).
      #   - --auth-local=trust: 소켓은 관리 컨테이너만 붙는다(머리말). --auth-host=scram-sha-256: initdb 기본값(trust)이면
      #     컨테이너 안 127.0.0.1 이 비밀번호 없이 열린다.
      #   initdb 인자라 **첫 초기화 때만** 먹는다. 이미 있는 볼륨의 로케일은 이 줄을 고쳐도 안 바뀐다.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 -E UTF8 --auth-local=trust --auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgrun:/var/run/postgresql
    healthcheck:
      # ★ TCP(127.0.0.1)로 잰다. 첫 초기화 동안 진입점이 띄우는 임시 서버는 소켓만 듣는다 - 소켓으로 재면 초기화가 끝나기
      #   전에 healthy 가 되어 migrate 가 임시 서버에 붙는다. pg_isready 는 인증 요청까지만 보고 로그인하지 않는다.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ★ 이전 실행기이자 **관리 컨테이너**다. 초사용자로 소켓에 붙는다 - 빈 DB 의 준비(역할 · 스키마 public 권한 · pg_trgm)는
  #   초사용자만 한다(server/internal/store/pg/bootstrap.sql 머리말). 손으로 돌리는 관리 명령(import-sqlite · export-sqlite ·
  #   verify · 되돌리기 · 되살리기 · psql)도 이 서비스로 한다: 원장(/data), 덤프 자리(/backups), psql · pg_dump · pg_restore
  #   (이미지의 postgresql17-client)가 다 여기 있다.
  migrate:
    depends_on:
      db:
        condition: service_healthy
    # ★ `--db` 를 빼고 FD_DB 로 준다. compose.yaml 의 `--db /data/fd.db` 가 남으면 Postgres 겹에서도 SQLite 파일을 올린다.
    command: ["migrate"]
    volumes:
      - pgrun:/var/run/postgresql
      # 판올림 전 덤프 자리(FD_BACKUP_DIR). 매일 덤프와 같은 호스트 자리의 뿌리다 - 매일 덤프는 그 아래 daily/ 를 쓴다.
      - ${FD_BACKUP_HOST:-${HOME}/.flightdeck-backups}:/backups
    environment:
      FD_DB: "postgres://postgres@/${FD_PG_DATABASE:-flightdeck}?host=/var/run/postgresql"
      FD_BACKUP_DIR: /backups
      # psql · pg_restore 와 되돌리기 스크립트(`fd migrate --rollback` 이 내는 것)가 읽는 libpq 접속.
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: "${FD_PG_DATABASE:-flightdeck}"

  # ★ 접속 계정을 맞추는 one-shot(deploy/db-roles.sh). 스키마를 올린 뒤, 서버와 매일 덤프가 뜨기 전에 돈다.
  #   서버 계정(FD_PG_SERVER_USER)은 fd_app 의 구성원, 덤프 계정(FD_PG_BACKUP_USER)은 pg_read_all_data 의 구성원이고, 둘 다
  #   특권 속성이 없다. 없으면 만들고, 있으면 속성 · 구성원 자격을 재어 어긋나면 고치지 않고 멈춘다(누가 왜 그렇게 만들었는지는
  #   사람이 본다). 비밀번호는 돌 때마다 pgpass 파일의 값으로 둔다. 바꾸는 법: 두 파일을 **제자리에서** 고치고(새 파일로 바꿔
  #   끼우면 붙어 있는 컨테이너에서 그 파일이 사라진다) `docker compose up -d --force-recreate --no-deps db-roles flightdeck
  #   db-backup`. 서버는 기동 때 한 번 읽으므로 다시 만들어야 새 값으로 붙는다.
  db-roles:
    image: postgres:17
    restart: "no"
    user: "${FD_UID:-1000}:${FD_GID:-1000}"
    entrypoint: ["sh", "/usr/local/bin/fd-db-roles"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/db-roles.sh:/usr/local/bin/fd-db-roles:ro
      - pgrun:/var/run/postgresql
    secrets:
      - fd_pg_server_pgpass
      - fd_pg_backup_pgpass
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: "${FD_PG_DATABASE:-flightdeck}"
      FD_PG_SERVER_USER: "${FD_PG_SERVER_USER:-fd_server}"
      FD_PG_BACKUP_USER: "${FD_PG_BACKUP_USER:-fd_backup}"
      FD_PG_SERVER_PGPASS: /run/secrets/fd_pg_server_pgpass
      FD_PG_BACKUP_PGPASS: /run/secrets/fd_pg_backup_pgpass
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ★ 서버는 앱 계정으로 TCP 에 붙는다. 소켓 볼륨과 덤프 자리를 안 붙인다 - 서버는 초사용자로도, 덤프 계정으로도 못 붙는다.
  #   비밀번호는 pgpass 시크릿 파일로만 받는다(pgx 가 PGPASSFILE 을 읽는다). 환경 변수 · URL 에 싣지 않는다 - docker inspect 에
  #   보인다.
  flightdeck:
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    secrets:
      - fd_pg_server_pgpass
    environment:
      FD_DB: "postgres://${FD_PG_SERVER_USER:-fd_server}@db:5432/${FD_PG_DATABASE:-flightdeck}"
      PGPASSFILE: /run/secrets/fd_pg_server_pgpass

  # ★ Postgres 원장의 매일 덤프(재설계 스펙의 백업 절: 매일 `pg_dump -Fc`, 14개 보관). 매시간 판단 원장(/ledger)과 다른
  #   겹이다 - 그것은 여섯 표의 결정적 산출물이고, 이것은 원장 전체를 새 DB 로 되살리는 복원 수단이다.
  #
  # ★ 이미지는 db 와 **같은 주판**의 postgres 다. pg_dump 는 자기보다 높은 서버를 거절한다. compose.test.yaml 의 pg-test 와도
  #   같은 이미지다(TestComposePostgresImagesMatchTheTestServer 가 셋을 맞댄다).
  #
  # ★ **`fd migrate` 가 돌기 전에 멈춘다(depends_on 의 restart: true).** pg_dump 는 끝날 때까지 모든 표의 ACCESS SHARE 잠금을
  #   쥐고, 판을 올리는 증분의 DDL 은 그 잠금을 lock_timeout(5초) 안에 못 얻으면 실패한다 - 갱신이 마침 덤프 시각에 걸리면
  #   판올림이 선다. 고른 길은 「migrate 전에 덤프를 멈춘다」다: compose 가 migrate 를 다시 만들 때(새 이미지 · 설정) 이
  #   서비스를 먼저 멈추고, migrate 가 성공으로 끝난 뒤 다시 띄운다. 내렸다 올리는 `up`(fd-update)은 처음부터 migrate 뒤에
  #   띄운다. 다른 두 길을 안 고른 까닭: 재시도는 판올림을 덤프 길이(최대 FD_DUMP_TIMEOUT)만큼 미루면서 실패를 「한 번 더」로
  #   덮고, 공유 잠금(권고 잠금)은 두 프로그램에 같은 잠금 키 · 같은 대기 규칙을 심어야 하는데 pg_dump 는 거기에 낄 자리가
  #   없다(스크립트가 따로 잠금 연결을 쥔 채 덤프해야 한다). 손으로 돌리는 migrate(`docker compose run`, `up --no-deps
  #   migrate`)에는 compose 가 이것을 안 한다 - 그 절차(README)는 db-backup 을 먼저 멈춘다.
  #
  # ★ 비밀번호는 pgpass 파일 하나로만 받는다(아래 secrets). 파일 권한은 0600 이고 주인은 FD_UID 여야 한다(libpq 가 그보다
  #   열린 파일을 무시하고, 이 서비스는 FD_UID 로 돈다 - compose 의 파일 시크릿은 호스트 파일을 그대로 붙인다).
  #
  # ★ 덤프 자리는 /backups/daily/<DB> 다(DB 이름은 소문자 · 숫자 · _ · - 밖의 바이트를 %XX 로 옮긴다). /backups 바로
  #   아래는 `fd migrate` 가 판을 올리기 전에 뜨는 덤프 자리라(FD_BACKUP_DIR), 회전이 그것을 못 지우게 하위 자리를 쓴다.
  #   되돌리기가 덤프를 고르는 훑기도 하위 자리를 안 본다. DB 마다 따로라 FD_PG_DATABASE 를 바꿔도 옛 DB 의 덤프가 새 DB 의
  #   때 확인에 쓰이거나 새 DB 의 회전에 지워지지 않는다. 다만 **FD_BACKUP_HOST 는 배포마다 따로 둔다** - 같은 DB 이름을 쓰는
  #   두 배포가 한 자리를 나누면 서로의 덤프로 때를 재고 서로의 덤프를 회전한다.
  #
  # ★ **FD_BACKUP_HOST 는 미리 만든다**(주인 FD_UID, 0700). 없으면 Linux 의 Docker 가 root 소유 0755 로 만들어 이 서비스가
  #   첫 덤프부터 못 쓴다(스크립트가 그때 고치는 명령을 로그에 낸다).
  #
  # ★ 덤프 한 번의 기한은 FD_DUMP_TIMEOUT 이다(기본 30m). `fd migrate` 의 판올림 전 덤프와 **같은 설정 하나**다 - 둘 다
  #   「이 원장의 정상 덤프가 걸리는 시간 + 여유」라 같은 값이 맞고, 늘릴 때 한 곳만 늘리는 어긋남이 없다. 같은 이름 ·
  #   같은 Go 시간 표기 · 같은 범위로 읽고 시험이 둘을 맞댄다(TestDBBackupDeadlineReadsLikeFdMigrate). 기한을 넘은 pg_dump 는
  #   끊고 실패로 친다.
  #
  # ★ 한 DB 자리에서는 한 실행만 돈다(자리의 flock). 정기 덤프가 도는 중에 `docker compose run --rm db-backup once` 를
  #   돌리면 그 once 는 아무것도 안 하고 3 으로 끝난다.
  #
  # ★ 덤프는 원장 전체라 파일 권한을 0600 으로 쓴다(스크립트의 umask). 이름에는 시각만 있다.
  db-backup:
    image: postgres:17
    restart: unless-stopped
    # 호스트 사용자로 돈다. 다르면 쌓인 덤프를 호스트에서 못 지우고, 자리를 못 만든다.
    user: "${FD_UID:-1000}:${FD_GID:-1000}"
    # ★ 이미지의 진입점(postgres 를 띄우는 스크립트)을 안 탄다 - 이 컨테이너는 DB 를 띄우지 않는다.
    entrypoint: ["sh", "/usr/local/bin/fd-db-backup"]
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
      db-roles:
        condition: service_completed_successfully
    volumes:
      - ./deploy/db-backup.sh:/usr/local/bin/fd-db-backup:ro
      - ${FD_BACKUP_HOST:-${HOME}/.flightdeck-backups}:/backups
    secrets:
      - fd_pg_backup_pgpass
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${FD_PG_DATABASE:-flightdeck}"
      PGUSER: "${FD_PG_BACKUP_USER:-fd_backup}"
      PGPASSFILE: /run/secrets/fd_pg_backup_pgpass
      FD_DB_BACKUP_DIR: /backups/daily
      FD_DB_BACKUP_KEEP: "14"
      FD_DUMP_TIMEOUT: "${FD_DUMP_TIMEOUT:-}"
    # 가장 새 덤프가 간격 + 확인 두 번 + 기한(기본 26시간 30분)보다 낡으면 unhealthy 다 - 덤프가 조용히 멈춘 것이
    # `docker compose ps` 에 보인다. 잘 도는 동안 가장 새 덤프의 나이는 간격 + 확인 한 번 + 덤프 시간을 안 넘는다.
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/fd-db-backup", "check"]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 1h
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # ★ 두 볼륨 모두 **프로젝트 밖의 고정 이름이고, compose 가 만들지 않는다**. 한 번 만든다:
  #     docker volume create flightdeck-pgdata && docker volume create flightdeck-pgrun
  #   - compose 프로젝트 이름은 디렉토리 이름이다. 플러그인 설치본은 판마다 디렉토리가 달라(…/flightdeck/<버전>), 프로젝트
  #     볼륨이면 갱신 한 번에 새 빈 볼륨을 만들고 옛 원장을 옛 프로젝트에 남긴다 - 서버는 빈 원장으로 뜬다.
  #   - external 이라 `docker compose down -v` 가 못 지우고, 볼륨이 없으면 빈 DB 를 새로 만드는 대신 `up` 이 선다.
  #   - compose 가 만든 볼륨에 이름만 고정하면 다른 판의 디렉토리에서 쓸 때마다 「다른 프로젝트가 만든 볼륨이다」 경고가 난다.
  # 원장 데이터.
  pgdata:
    external: true
    name: flightdeck-pgdata
  # 소켓 자리. 판이 바뀐 디렉토리에서 돌리는 관리 명령(fd-update 의 selfcheck)도 같은 소켓에 닿는다. 소켓 · 잠금 파일뿐이라
  # 비워도 db 가 다시 만든다.
  pgrun:
    external: true
    name: flightdeck-pgrun

secrets:
  # ★ 두 파일 모두 **서버 마운트 밖에** 둔다(예: /etc/flightdeck/, 주인 FD_UID, 0600). 서버는 같은 uid 로 FD_REPOS(기본 홈
  #   전체)를 읽기 전용으로 붙인다 - 홈 안에 두면 0600 이어도 서버가 덤프 계정의 비밀번호까지 읽는다. 기본값을 두지 않는다:
  #   root 없이 만들 수 있는 홈 밖 자리가 없어, 기본값은 늘 홈 안이 된다. 비면 `up` 이 이 사유로 선다.
  # 줄의 꼴은 `db:5432:<DB>:<계정>:<비밀번호>` 하나다(deploy/db-roles.sh 가 libpq 와 pgx 가 같게 읽는 꼴만 받는다).
  fd_pg_server_pgpass:
    file: ${FD_PG_SERVER_PGPASS_HOST:?서버 계정의 pgpass 파일 자리 - 홈 밖에 둔다(README 「Postgres 로 띄우기」)}
  fd_pg_backup_pgpass:
    file: ${FD_PG_BACKUP_PGPASS_HOST:?덤프 계정의 pgpass 파일 자리 - 홈 밖에 둔다(README 「Postgres 로 띄우기」)}
